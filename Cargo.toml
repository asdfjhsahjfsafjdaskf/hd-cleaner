[workspace]
resolver = "2"
members = ["crates/hdcleaner-core", "crates/hdcleaner-cli", "crates/test-fixtures", "src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Unlicense"
rust-version = "1.80"

[workspace.dependencies]
hdcleaner-core = { path = "crates/hdcleaner-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rayon = "1.10"
parking_lot = "0.12"
blake3 = "1.5"
rusqlite = { version = "0.37", features = ["bundled"] }
lz4_flex = "0.11"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_SystemInformation",
  "Win32_System_Registry",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Com",
  "Win32_System_Memory",
  "Win32_System_Environment",
  "Win32_System_Time",
  "Win32_System_Pipes",
  "Win32_System_Services",
  "Win32_System_Restore",
  "Win32_UI_Shell_Common",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_EventLog",
  "Win32_System_DataExchange",
  "Win32_System_Ole",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  ] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Ole",
  "ApplicationModel",
  "Win32_System_TaskScheduler",
  "Win32_Storage_FileSystem",
  "Win32_System_Variant",
  "Management_Deployment",
  "Foundation",
  "Foundation_Collections",
  "Storage",
  "System",
] }
png = "0.17"

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

# The scanner/search are CPU bound: keep them fast in dev builds too.
[profile.dev.package.hdcleaner-core]
opt-level = 2
